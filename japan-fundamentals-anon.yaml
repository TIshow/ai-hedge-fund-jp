# Historical experiment: an LLM investor agent reading J-Quants
# 決算短信 summaries (TTM, disclosed before each rebalance date). Values in JPY.
# A bearish view is a simulated short sale, as in the upstream design.
# Same capital, lots, and limits as japan-pilot.yaml so only the signal differs.
# Each rebalance calls the LLM once per ticker whose snapshot changed.
# Identical to japan-fundamentals.yaml except the prompt is anonymized, so the
# two runs show how much the agent leans on recognising the company.
name: japan-fundamentals-anon
strategies:
  - name: buffett-fundamentals-anon
    models:
      - name: buffett
        params:
          anonymize: true  # withhold ticker, sector, size, and dates from the LLM
risk:
  max_position_pct: 0.5
  max_gross_exposure: 1.0
capital: 1000000
lot_size: 100
rebalance: weekly
benchmark: "1306"
